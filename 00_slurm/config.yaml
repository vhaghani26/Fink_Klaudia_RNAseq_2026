cluster:
  sbatch
    --cpus-per-task={threads}
    --mem={resources.mem_mb}
    --time={resources.time}
    --job-name=klaudia-{rule}
    --ntasks={resources.nodes}
    --nodes={resources.nodes}
    --partition=production
    --parsable
default-resources:
  - mem_mb=20000
  - time=2880
  - partition=production
  - threads=1
  - nodes=1
jobs: 50
latency-wait: 60
local-cores: 1
restart-times: 1
max-jobs-per-second: 100
max-status-checks-per-second: 20
keep-going: True
rerun-incomplete: True
printshellcmds: True
scheduler: greedy
use-conda: True
conda-prefix: /share/korflab/home/viki/anaconda3/
conda-frontend: conda
cluster-status: 00_slurm/slurm-status.py
